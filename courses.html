<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الدورات التدريبية - مدرسة وي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles2.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- الشريط العلوي -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-laptop-code"></i> مدرسة وي
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home">الرئيسية</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#courses">الدورات</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">نبذة عنا</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">تواصل معنا</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- قسم الدورات التدريبية -->
    <section id="courses" class="py-5">
        <div class="container">
            <h2 class="text-center mb-4">الدورات التدريبية</h2>
            <div class="row mb-4">
                <div class="col-md-6">
                    <input type="text" id="searchInput" class="form-control" placeholder="ابحث عن دورة...">
                </div>
                <div class="col-md-6">
                    <select id="filterCategory" class="form-select">
                        <option value="all">جميع الفئات</option>
                        <option value="web">تطوير الويب</option>
                        <option value="ai">الذكاء الاصطناعي</option>
                        <option value="security">أمن المعلومات</option>
                    </select>
                </div>
            </div>
            <div class="row" id="coursesContainer">
                <!-- سيتم إضافة الدورات هنا عبر JavaScript -->
            </div>
        </div>
    </section>

    <!-- تذييل الصفحة -->
    <footer class="bg-dark text-white text-center py-3">
        <p>جميع الحقوق محفوظة &copy; 2023 مدرسة وي للتكنولوجيا التطبيقية</p>
    </footer>

    <!-- مكتبات JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts2.js"></script>
</body>
</html>
